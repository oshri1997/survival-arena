<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080e23"><title>Survival Arena LIVE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070d20;color:white;font:600 14px system-ui,-apple-system,sans-serif}main{max-width:540px;margin:auto;min-height:100dvh;background:linear-gradient(#0b1636,#101a34);display:flex;flex-direction:column}.top{padding:14px 14px 8px;display:flex;justify-content:space-between;align-items:center}.top strong{font-size:19px;letter-spacing:1px}.pill{background:#ff276c;border-radius:9px;padding:9px 12px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 12px}.stat{border:1px solid #3d558e;border-radius:13px;text-align:center;padding:9px 4px;background:#0a1430}.stat small{display:block;color:#9cb1db;letter-spacing:2px;font-size:10px}.stat b{display:block;font-size:24px;color:#ffda8a}.hp{height:14px;border:2px solid #7896ce;border-radius:20px;margin:4px 14px 8px;overflow:hidden;background:#35182c}.hp>div{height:100%;width:100%;background:linear-gradient(90deg,#ff3678,#ffb36d);transition:width .2s}#field{display:block;width:100%;flex:1;min-height:400px;touch-action:manipulation}.controls{display:flex;gap:8px;padding:8px 12px 12px}.controls button{flex:1;min-width:0;border:1px solid #91b2ff;background:linear-gradient(#263c70,#17264b);border-radius:14px;color:white;padding:15px 3px;font-weight:800;font-size:12px;cursor:pointer}.footer{text-align:center;color:#94a6c9;padding-bottom:14px;font-size:11px}
</style></head><body><main><div class="top"><strong>⚔️ SURVIVAL ARENA</strong><span class="pill">● DEMO LIVE</span></div><div class="stats"><div class="stat"><small>WAVE</small><b id="wave">1</b></div><div class="stat"><small>KILLS</small><b id="kills">0</b></div><div class="stat"><small>SCORE</small><b id="score">0</b></div></div><div class="hp"><div id="hp"></div></div><canvas id="field"></canvas><div class="controls"><button id="fire">🔥 FIREBALL</button><button id="freeze">❄️ FREEZE</button><button id="gift">🎁 GIFT TEST</button></div><div class="footer">Playable prototype · simulated gifts · no TikTok connection</div></main>
<script>
(()=>{const c=document.getElementById('field'),ctx=c.getContext('2d');let W=400,H=600,dpr=1;const state={wave:1,kills:0,score:0,hp:100,enemies:[],particles:[],shots:[],tick:0,freeze:0,shake:0,ended:false};const center=()=>({x:W/2,y:H*.53});function resize(){const r=c.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function burst(x,y,color,n=14){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=1+Math.random()*4;state.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:40,color})}}
function spawn(){let a=Math.random()*Math.PI*2,p=center(),radius=Math.max(W,H)*.7;state.enemies.push({x:p.x+Math.cos(a)*radius,y:p.y+Math.sin(a)*radius,r:10+Math.random()*7,hp:1+Math.floor(state.wave/4),speed:.42+state.wave*.035+Math.random()*.3,hue:Math.random()>.75?12:280})}
function kill(e){state.kills++;state.score+=25;burst(e.x,e.y,e.hue===12?'#ff9b4b':'#d675ff',16);state.enemies.splice(state.enemies.indexOf(e),1);if(state.kills%15===0)state.wave++;document.getElementById('kills').textContent=state.kills;document.getElementById('score').textContent=state.score;document.getElementById('wave').textContent=state.wave}
function fireball(){if(state.ended)return;let p=center();state.shake=8;for(const e of [...state.enemies]){if(Math.hypot(e.x-p.x,e.y-p.y)<W*.55)kill(e)}burst(p.x,p.y,'#ffb14b',45)}
function freeze(){state.freeze=240;burst(center().x,center().y,'#7feaff',32)}
function gift(){state.score+=100;state.hp=Math.min(100,state.hp+15);document.getElementById('score').textContent=state.score;document.getElementById('hp').style.width=state.hp+'%';burst(center().x,center().y,'#ffe38d',55)}
document.getElementById('fire').onclick=fireball;document.getElementById('freeze').onclick=freeze;document.getElementById('gift').onclick=gift;c.addEventListener('pointerdown',fireball);
function draw(t){const dt=Math.min((t-(draw.last||t))/16.67,2);draw.last=t;state.tick+=dt;let p=center();ctx.clearRect(0,0,W,H);let bg=ctx.createRadialGradient(p.x,p.y,15,p.x,p.y,H*.75);bg.addColorStop(0,'#1b3766');bg.addColorStop(1,'#080f25');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff0b';ctx.lineWidth=1;for(let x=0;x<W;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
ctx.save();if(state.shake>0){ctx.translate((Math.random()-.5)*state.shake,(Math.random()-.5)*state.shake);state.shake*=.84}
for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(p.x,p.y,65+i*42+Math.sin(state.tick*.02+i)*3,0,Math.PI*2);ctx.strokeStyle='#739dff55';ctx.lineWidth=2;ctx.stroke()}
if(!state.ended&&state.tick%Math.max(17,55-state.wave*2)<dt)spawn();
for(const e of [...state.enemies]){let a=Math.atan2(p.y-e.y,p.x-e.x);if(state.freeze<=0){e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt}let dist=Math.hypot(e.x-p.x,e.y-p.y);if(dist<27){state.hp=Math.max(0,state.hp-.15*dt);document.getElementById('hp').style.width=state.hp+'%';if(state.hp<=0){state.ended=true}e.x-=Math.cos(a)*30;e.y-=Math.sin(a)*30}ctx.shadowColor=e.hue===12?'#ff803f':'#be67ff';ctx.shadowBlur=18;ctx.fillStyle=e.hue===12?'#ff9658':'#ac71ef';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.fillRect(e.x-5,e.y-3,3,3);ctx.fillRect(e.x+3,e.y-3,3,3)}
if(state.freeze>0)state.freeze-=dt;if(!state.ended&&state.tick%17<dt&&state.enemies.length){let e=state.enemies.reduce((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)<Math.hypot(b.x-p.x,b.y-p.y)?a:b);e.hp--;burst(e.x,e.y,'#7ceeff',5);if(e.hp<=0)kill(e)}
for(let i=state.particles.length-1;i>=0;i--){let q=state.particles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;ctx.globalAlpha=Math.max(0,q.life/40);ctx.fillStyle=q.color;ctx.beginPath();ctx.arc(q.x,q.y,Math.max(1,q.life/12),0,7);ctx.fill();ctx.globalAlpha=1;if(q.life<=0)state.particles.splice(i,1)}
ctx.translate(p.x,p.y);ctx.rotate(state.tick*.008);ctx.shadowColor='#29eaff';ctx.shadowBlur=35;ctx.fillStyle='#13bce7';ctx.beginPath();for(let i=0;i<6;i++){let a=i*Math.PI/3;ctx.lineTo(Math.cos(a)*37,Math.sin(a)*37)}ctx.closePath();ctx.fill();ctx.shadowBlur=15;ctx.fillStyle='#eaffff';ctx.beginPath();ctx.arc(0,0,18+Math.sin(state.tick*.07)*2,0,7);ctx.fill();ctx.restore();
if(state.ended){ctx.fillStyle='#04091dcc';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 32px system-ui';ctx.fillText('GAME OVER',W/2,H/2);ctx.font='16px system-ui';ctx.fillText('Tap to restart',W/2,H/2+36)}requestAnimationFrame(draw)}
c.addEventListener('pointerdown',()=>{if(state.ended)location.reload()});requestAnimationFrame(draw)})();
</script></body></html>
